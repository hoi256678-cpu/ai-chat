ext {
    // 26, not Capacitor's scaffold default of 24: androidx.health.connect:connect-client
    // declares minSdkVersion 26 in its AAR manifest (manifest merger fails otherwise), and
    // HealthConnectPlugin.kt uses java.time.Instant, which is only available natively on
    // API 26+ (staying on 24 would need coreLibraryDesugaring to avoid a NoClassDefFoundError).
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}